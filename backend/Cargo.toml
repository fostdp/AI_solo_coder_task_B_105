[workspace]
members = [
    "crates/fem_stress",
    "crates/peg_advection",
    "crates/gp_termination",
    "crates/stability_assess",
]
resolver = "2"

[package]
name = "lacquer-monitor-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = { version = "0.12", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
prometheus = "0.13"
dotenvy = "0.15"
rand = "0.8"
num_cpus = "1.16"

fem_stress = { path = "crates/fem_stress" }
peg_advection = { path = "crates/peg_advection" }
gp_termination = { path = "crates/gp_termination" }
stability_assess = { path = "crates/stability_assess" }
